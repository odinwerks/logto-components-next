name: Semgrep Aggressive Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {} 

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep CLI
        run: python3 -m pip install semgrep

      - name: Run Semgrep and generate SARIF
        run: >-
          semgrep scan 
          --config="p/default" 
          --config="p/security-audit" 
          --config="p/secrets" 
          --config="p/typescript" 
          --config="p/react" 
          --config="p/nextjs" 
          --sarif > semgrep.sarif
        continue-on-error: true

      - name: Upload alerts to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
