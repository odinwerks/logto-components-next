name: Semgrep Aggressive Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (pinned)

      - name: Install Semgrep CLI
        run: python3 -m pip install semgrep

      - name: Run Semgrep and generate SARIF
        run: >-
           semgrep scan
           --config="p/default"
           --config="p/security-audit"
           --config="p/secrets"
           --config="p/typescript"
           --config="p/react"
           --config="p/nextjs"
           --severity=ERROR
           --error
           --sarif > semgrep.sarif

      - name: Upload alerts to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07  # v3.37.3 (pinned)
        if: always()
        with:
          sarif_file: semgrep.sarif
